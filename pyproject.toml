[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bagshare"
version = "0.2.0"
description = "Offline LAN transfer tool for large ROS bag files"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "BagShare contributors"}]
dependencies = []

[project.scripts]
bagshare = "bagshare.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
